# ============================================================
# Configuración del Microservicio de Productos (Spring Boot)
# Equivalente a settings.py del proyecto Django
# ============================================================

# Nombre de la aplicación
spring.application.name=productos-microservice

# Puerto del servidor (mismo que Django: 8000)
server.port=8000

# ── Base de Datos H2 (equivalente a SQLite en Django) ──
spring.datasource.url=jdbc:h2:file:./data/ecommerce_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA / Hibernate ──
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Jackson (serialización JSON) ──
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Santiago

# ── Swagger / OpenAPI ──
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/swagger-ui.html
